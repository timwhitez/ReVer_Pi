name: Research assurance contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install test-only dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Test scoring, uncertainty and authorization contracts
        run: >-
          python3 -B -m pytest -q
          research/s5/tests/test_s5_contracts.py
          research/s5/tests/test_s5_statistics.py
          research/s5/tests/test_s5_assurance.py

# This workflow performs no model call and needs no provider secrets.
# It does not certify native Pi execution, repository-wide coverage or agent quality.
